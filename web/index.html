<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Profile System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css" type="text/css"/>

    <style>
       body {
    background-color: #fff0f5 !important;
    background-image: linear-gradient(
        135deg,
        #fff0f5,
        #ffe4ec,
        #fff0f5
    ) !important;
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    min-height: 100vh;
}

.container {
    width: 100% !important;
    max-width: 500px !important;
    margin: 0 auto !important;
}

.custom-card-blue {
    width: 100% !important;
    padding: 30px !important;
}

/* Heading */
.title-blue {
    font-family: 'Fredoka', sans-serif !important;
    font-size: 26px !important;
    font-weight: 600 !important;
    color: #e75480 !important;
}

/* Form labels */
.label-blue {
    font-size: 15px !important;
    color: #d87093 !important;
}

/* Input fields */
.form-control {
    font-family: 'Fredoka', sans-serif !important;
    font-size: 15px !important;
    padding: 10px 12px !important;
}

/* Submit button */
.btn-blue-submit {
    font-size: 16px !important;
    padding: 10px !important;
}

/* Links */
.link-blue {
    display: block !important;
    width: 100% !important;
    padding: 12px !important;
    margin-top: 12px !important;
    background-color: #fff0f5 !important;
    border: 1.5px solid #ffb6c8 !important;
    border-radius: 30px !important;
    color: #e75480 !important;
    font-family: 'Fredoka', sans-serif !important;
    font-size: 15px !important;
    font-weight: 600 !important;
    text-decoration: none !important;
    transition: all 0.3s ease;
}

.link-blue:hover {
    background-color: #ff91af !important;
    color: white !important;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(255, 145, 175, 0.3);
}
    </style>
</head>
<body class="py-5">
    <div class="container" style="max-width: 500px;">
        <div class="card border-0 rounded-4 p-4 custom-card-blue">
            
            <h3 class="fw-bold text-center mb-4 title-blue">
    ୨୧ Welcome to My Profile! 
    <i class="bi bi-stars"></i>
</h3>
            
            <form action="ProfileServlet" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold small label-blue">Student ID:</label>
                    <input type="text" name="studentID" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold small label-blue">Name:</label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold small label-blue">Programme:</label>
                    <input type="text" name="programme" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold small label-blue">Email:</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold small label-blue">Hobbies:</label>
                    <input type="text" name="hobbies" class="form-control" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold small label-blue">Short Self Introduction:</label>
                    <textarea name="introduction" class="form-control" rows="4" required></textarea>
                </div>
                
                <div class="d-grid">
                    <button type="submit" class="btn btn-blue-submit rounded-pill fw-bold shadow-sm">Save Profile</button>
                </div>
            </form>
            
           <div class="text-center mt-3">

    <p>
        <a href="ViewProfileServlet" class="link-blue">
            ♡ View All Profiles
        </a>
    </p>

    <p>
        <a href="SearchProfileServlet" class="link-blue">
            ♡ Search All Profiles
        </a>
    </p>

</div>
        </div>
    </div>
</body>
</html>
